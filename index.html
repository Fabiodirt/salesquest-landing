<meta property="og:description" content="Coach IA, mises en situation immersives et méthodes reconnues. Vos documents internes transformés en entraînement sur-mesure par l'IA. Suivi en temps réel pour le manager.">

<style>
  :root{
    --navy: #003A54;
    --navy-deep: #00263A;
    --navy-light: #004D6E;
    --orange: #F18700;
    --orange-dark: #D97600;
    --bg: #FFFFFF;
    --bg-soft: #F4F7F8;
    --text: #12242F;
    --text-soft: #4E6672;
    --line: #E2E8EA;
    --white: #FFFFFF;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html{ scroll-behavior: smooth; font-size: 17.5px; }

  body{
    font-family: 'Archivo', sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  img{ max-width:100%; display:block; }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px;
  }

  h1,h2,h3{ font-weight: 800; letter-spacing: -0.015em; }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(241, 135, 0, 0.12);
    color: var(--orange);
    border: 1px solid rgba(241, 135, 0, 0.25);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 6px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ---------- NAV ---------- */
  .nav{
    background: var(--navy);
    padding: 18px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .nav .wrap{
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .logo{
    font-weight: 900;
    font-size: 1.3rem;
    color: var(--white);
    letter-spacing: -0.02em;
  }
  .logo span{ color: var(--orange); }
  .nav-cta{
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 22px;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(241,135,0,0.3);
    transition: all 0.2s ease;
  }
  .nav-cta:hover{ background: var(--orange-dark); transform: translateY(-1px); }

  /* ---------- HERO ---------- */
  .hero{
    background: var(--navy-deep);
    color: var(--white);
    padding: 80px 0 0;
    overflow: hidden;
    position: relative;
  }
  .hero::before{
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(45% 55% at 20% 25%, rgba(241,135,0,0.18), transparent 60%),
      radial-gradient(55% 65% at 85% 75%, rgba(0,120,160,0.22), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    background-size: 180% 180%, 180% 180%, 100% 100%;
    animation: mesh-drift 22s ease-in-out infinite;
    z-index: 0;
  }
  .hero .wrap{ position: relative; z-index: 1; }

  @keyframes mesh-drift{
    0%{ background-position: 0% 0%, 100% 100%, 0 0; }
    50%{ background-position: 30% 20%, 70% 80%, 0 0; }
    100%{ background-position: 0% 0%, 100% 100%, 0 0; }
  }

  .hero .wrap{
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 48px;
    align-items: center;
  }
  .hero-copy{ padding-bottom: 88px; }
  .hero h1{
    font-size: clamp(2.4rem, 4.1vw, 3.5rem);
    line-height: 1.12;
    margin-top: 18px;
  }
  .hero p.sub{
    margin-top: 22px;
    font-size: 1.2rem;
    color: #C7D8DF;
    max-width: 48ch;
    font-weight: 400;
    line-height: 1.6;
  }
  .cta-block{
    margin-top: 36px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .btn-primary{
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 1.05rem;
    padding: 16px 32px;
    border-radius: 8px;
    display: inline-block;
    box-shadow: 0 6px 20px rgba(241,135,0,0.35);
    transition: all 0.2s ease;
  }
  .btn-primary:hover{ background: var(--orange-dark); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(241,135,0,0.45); }
  .micro{
    font-size: 0.88rem;
    color: #93AAB4;
  }

  .hero-visual{
    position: relative;
    display:flex;
    justify-content: center;
    padding-bottom: 20px;
  }
  .phone{
    width: 270px;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 35px 70px -15px rgba(0,0,0,0.65), 0 0 0 8px rgba(255,255,255,0.08);
    position: relative;
    z-index: 2;
    transform: rotate(-4deg);
    transition: transform 0.3s ease;
  }
  .phone:hover{ transform: rotate(0deg) scale(1.02); }
  .phone img{ width:100%; display:block; }

  /* ---------- PROBLEM ---------- */
  .problem{
    padding: 88px 0;
    background: #FAFCFC;
    border-bottom: 1px solid var(--line);
  }
  .problem .wrap{
    max-width: 780px;
    text-align: center;
  }
  .problem h2{
    font-size: clamp(1.8rem, 2.8vw, 2.3rem);
    color: var(--navy);
  }
  .problem p{
    margin: 20px auto 0;
    font-size: 1.2rem;
    color: var(--text-soft);
    line-height: 1.65;
  }

  /* ---------- STATS ---------- */
  .stats{
    background: var(--navy);
    color: var(--white);
    padding: 64px 0;
  }
  .stats-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .stat{
    padding: 0 24px;
    border-left: 1px solid rgba(255,255,255,0.14);
  }
  .stat:first-child{ border-left: none; padding-left: 0; }
  .stat .num{
    font-size: clamp(2.3rem, 3.5vw, 3rem);
    font-weight: 900;
    color: var(--orange);
    letter-spacing: -0.02em;
  }
  .stat p{
    margin-top: 10px;
    font-size: 0.98rem;
    color: #C7D8DF;
    line-height: 1.45;
  }
  .stat .source{
    display: block;
    margin-top: 8px;
    font-size: 0.75rem;
    color: #7C97A2;
    font-style: italic;
  }
  .stat-bar{
    margin-top: 16px;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .stat-bar-fill{
    height: 100%;
    width: 0%;
    background: var(--orange);
    border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ---------- FEATURES / BENTO ---------- */
  .features{
    padding: 96px 0;
  }
  .features-head{
    max-width: 700px;
    margin-bottom: 48px;
  }
  .features-head h2{
    font-size: clamp(1.8rem, 2.8vw, 2.3rem);
    color: var(--navy);
    margin-top: 12px;
  }
  .features-head p{
    font-size: 1.15rem;
    color: var(--text-soft);
    margin-top: 12px;
  }

  .bento{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: minmax(180px, auto);
    gap: 24px;
  }
  .tile{
    border-radius: 20px;
    padding: 30px;
    position: relative;
    overflow: hidden;
    background: var(--white);
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease;
    opacity: 0;
    transform: translateY(18px);
  }
  .tile.in-view{ opacity: 1; transform: translateY(0); }
  .tile:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.07);
  }
  @media (prefers-reduced-motion: reduce){
    .tile{ opacity: 1; transform: none; }
  }

  /* ---------- FLOATING MINI CTA ---------- */
  .mini-cta{
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 200;
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 14px 24px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
  }
  .mini-cta.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .mini-cta:hover{ background: var(--orange-dark); }
  @media (max-width: 600px){
    .mini-cta{ left: 16px; right: 16px; bottom: 16px; text-align: center; }
  }

  /* Highlight Feature: Library / AI Generator */
  .tile-library-hero{
    grid-column: span 6;
    background: linear-gradient(135deg, #002D42 0%, var(--navy) 100%);
    color: var(--white);
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
  }
  .tile-library-hero .tile-copy{
    padding: 44px;
    flex: 0 0 42%;
  }
  .tile-library-hero h3{ font-size: 1.6rem; color: var(--white); font-weight: 800; line-height: 1.3; }
  .tile-library-hero p{ margin-top: 14px; font-size: 1.08rem; color: #C7D8DF; line-height: 1.6; }
  .tile-library-hero .tile-img-wrapper{
    flex: 1;
    height: 100%;
    min-height: 360px;
    position: relative;
    overflow: hidden;
  }
  .tile-library-hero img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top left;
    border-left: 1px solid rgba(255,255,255,0.1);
  }

  .tile-plain{
    grid-column: span 2;
    background: var(--bg-soft);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .tile-plain h3{ font-size: 1.2rem; color: var(--navy); font-weight: 700; margin-top: 18px; }
  .tile-plain p{ margin-top: 8px; font-size: 1rem; color: var(--text-soft); line-height: 1.55; }

  .tile-solution{
    grid-column: span 4;
    background: radial-gradient(120% 100% at 100% 0%, #0a4d6b 0%, var(--navy) 70%);
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .tile-solution .tile-copy{ flex: 1; }
  .tile-solution h3{ color: var(--white); font-size: 1.45rem; font-weight: 800; }
  .tile-solution p{ margin-top: 10px; color: #C7D8DF; font-size: 1.05rem; line-height: 1.55; }
  .tile-solution .tile-img{
    width: 170px;
    border-radius: 12px;
    box-shadow: 0 14px 28px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .tile-dashboard{
    grid-column: span 6;
    background: var(--bg-soft);
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    gap: 32px;
    align-items: center;
    padding: 36px;
  }
  .tile-dashboard h3{ font-size: 1.4rem; color: var(--navy); font-weight: 800; }
  .tile-dashboard p{ margin-top: 12px; font-size: 1.05rem; color: var(--text-soft); line-height: 1.6; }
  .tile-dashboard img{
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    border: 1px solid var(--line);
  }

  .feature-icon{
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--white);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .feature-icon svg{ width: 24px; height: 24px; }

  /* ---------- AUDIENCE ---------- */
  .audience{
    padding: 96px 0;
    background: var(--navy-deep);
    color: var(--white);
    position: relative;
  }
  .audience .wrap{ max-width: 800px; text-align: center; }
  .audience-mark{ margin-bottom: 16px; }
  .audience-mark svg{ width: 48px; height: 38px; }
  .audience h2{
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    color: var(--white);
